name: Replace HEN Settings Icon

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image name without extension (example: Rockhen)"
        required: true
        type: string

      image_extension:
        description: "Extension (example: png.PNG)"
        required: true
        type: string

      remove_old:
        description: "Enter Y to remove the source image after successful replacement. Leave empty to keep it."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Replace image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_EXTENSION: ${{ inputs.image_extension }}
          REMOVE_OLD: ${{ inputs.remove_old }}
        run: |
          set -e

          SOURCE="plugin_mono/data/${IMAGE_NAME}.${IMAGE_EXTENSION}"
          TARGET="plugin_mono/data/hen_settings_icon.png"

          echo "======================================"
          echo "Image replacement"
          echo "======================================"
          echo "Source: $SOURCE"
          echo "Target: $TARGET"
          echo ""

          # Make sure the source exists.
          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Source image does not exist:"
            echo "$SOURCE"
            echo ""
            echo "Check the image name and extension."
            exit 1
          fi

          # Prevent accidentally copying the target onto itself.
          if [ "$SOURCE" = "$TARGET" ]; then
            echo "ERROR: Source and target are the same file."
            exit 1
          fi

          # Create/replace the target.
          cp "$SOURCE" "$TARGET"

          echo "Replacement copied successfully."
          echo ""

          # Calculate hashes.
          SOURCE_HASH=$(sha256sum "$SOURCE" | awk '{print $1}')
          TARGET_HASH=$(sha256sum "$TARGET" | awk '{print $1}')

          echo "Source SHA-256:"
          echo "$SOURCE_HASH"
          echo ""

          echo "Target SHA-256:"
          echo "$TARGET_HASH"
          echo ""

          # Verify the target is an exact copy.
          if [ "$SOURCE_HASH" != "$TARGET_HASH" ]; then
            echo "ERROR: Verification failed."
            echo "The source and target files are different."
            exit 1
          fi

          echo "SUCCESS: Image replacement verified."
          echo ""

          # Remove the source only when Y/y was entered.
          if [ "$REMOVE_OLD" = "Y" ] || [ "$REMOVE_OLD" = "y" ]; then
            echo "Remove old image: YES"
            echo "Removing: $SOURCE"

            rm "$SOURCE"

            if [ -f "$SOURCE" ]; then
              echo "ERROR: Failed to remove source image."
              exit 1
            fi

            echo "Source image removed successfully."
          else
            echo "Remove old image: NO"
            echo "Source image will be kept."
          fi

      - name: Commit changes
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A plugin_mono/data/

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace HEN settings icon"
          git push
